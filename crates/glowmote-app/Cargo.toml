[package]
name = "glowmote-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "glowmote_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
glowmote-control = { path = "../glowmote-control" }
tauri = { version = "2.12.5", features = [] }

[target.'cfg(not(target_os = "android"))'.dependencies]
glowmote-audio = { path = "../glowmote-audio" }
tokio = { version = "1.54.1", features = ["time"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-blec = "0.18.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
